<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Degen Team Portal — Employee redesign mockup</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  /* Tokens: same values as portal.css (--pt-*) / linear.css (--lx-*), plus proposed
     type + spacing scales so pages stop hardcoding px. */
  :root {
    --accent: #ff6b5b; --accent-hover: #ff8577; --accent-soft: rgba(255,107,91,.14); --accent-ink: #18181b;
    --ok: #34d399; --ok-soft: rgba(52,211,153,.14);
    --warn: #fcd34d; --warn-soft: rgba(252,211,77,.14);
    --err: #fca5a5; --err-soft: rgba(252,165,165,.14);
    --info: #93c5fd; --info-soft: rgba(147,197,253,.14);
    --bg: #08090a; --s1: #111214; --s2: #17181c; --s3: #1d1e23;
    --br: rgba(255,255,255,.07); --br2: rgba(255,255,255,.13);
    --text: #f4f4f5; --muted: #9ca0af; --dim: #6b6f7e;
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
    --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 17px; --fs-xl: 22px; --fs-2xl: 34px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
    --tap: 44px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #050506; color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01", "tnum"; }
  button { font: inherit; color: inherit; }

  /* ---------- Presentation chrome (not part of the design) ---------- */
  .stage { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }
  .stage h1 { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin: 0 0 6px; }
  .stage .lede { color: var(--muted); font-size: 14px; margin: 0 0 20px; max-width: 760px; line-height: 1.5; }
  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-bottom: 28px;
    padding: 12px 14px; border: 1px solid var(--br); border-radius: var(--r-md); background: var(--s1); }
  .controls label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 8px; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--br); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--s3); color: var(--text); }
  .layout { display: grid; grid-template-columns: 390px 1fr; gap: 40px; align-items: start; }
  .notes { position: sticky; top: 24px; }
  .notes h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -.01em; }
  .notes .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .notes ol { margin: 0; padding-left: 20px; }
  .notes li { font-size: 14px; line-height: 1.55; margin-bottom: 10px; color: #d4d4d8; }
  .notes li b { color: var(--text); }
  .notes .was { margin-top: 20px; padding: 12px 14px; border-radius: var(--r-md); background: var(--s1); border: 1px dashed var(--br2); font-size: 13px; color: var(--muted); line-height: 1.5; }
  .notes .was b { color: var(--err); font-weight: 600; }
  .all { display: none; gap: 28px; overflow-x: auto; padding-bottom: 16px; }
  body.show-all .layout { display: none; }
  body.show-all .all { display: flex; }
  .all .cap { font-size: 13px; color: var(--muted); margin: 0 0 8px 4px; }

  /* ---------- Phone ---------- */
  .phone { width: 390px; height: 844px; border-radius: 52px; background: var(--bg); position: relative;
    border: 10px solid #1b1c20; box-shadow: 0 0 0 1px #2a2b31, 0 40px 80px -30px rgba(0,0,0,.8); overflow: hidden; flex: none; }
  .phone::before { content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 30; }
  .statusbar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font-size: 15px; font-weight: 600; }
  .screen { position: absolute; inset: 50px 0 84px 0; overflow-y: auto; padding: 8px 16px 24px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }

  /* ---------- Components (proposed shared kit) ---------- */
  .topline { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 14px; }
  .eyebrow { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  .title { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.03em; margin: 2px 0 0; line-height: 1.1; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#ff8a6b,#c2410c); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
  .card { background: var(--s1); border: 1px solid var(--br); border-radius: var(--r-lg); padding: var(--sp-4); }
  .card + .card, .section + .section, .card + .section, .section + .card { margin-top: var(--sp-3); }
  .section { margin-top: var(--sp-5); }
  .section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px var(--sp-2); }
  .section-h h3 { margin: 0; font-size: var(--fs-md); font-weight: 650; }
  .section-h a { color: var(--accent); font-size: var(--fs-sm); text-decoration: none; font-weight: 550; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap);
    padding: 0 18px; border-radius: 12px; border: 1px solid var(--br2); background: var(--s2); font-weight: 600; font-size: var(--fs-md); cursor: pointer; text-decoration: none; color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 36px; font-size: var(--fs-sm); padding: 0 12px; border-radius: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.err { color: var(--err); background: var(--err-soft); }
  .pill.info { color: var(--info); background: var(--info-soft); }
  .pill.neutral { color: var(--muted); background: rgba(255,255,255,.06); }
  .rows { background: var(--s1); border: 1px solid var(--br); border-radius: var(--r-lg); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; border-top: 1px solid var(--br); text-decoration: none; color: inherit; cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .l1 { font-size: var(--fs-md); font-weight: 550; }
  .row .l2 { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
  .row .chev { color: var(--dim); font-size: 18px; }
  .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--s3); }
  .ico svg { width: 18px; height: 18px; }
  .dot-unread { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .count { min-width: 22px; height: 22px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
  .callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--s2); border: 1px solid var(--br); font-size: var(--fs-sm); color: var(--muted); line-height: 1.45; }
  .callout svg { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--info); }

  /* Hero status */
  .hero { border-radius: var(--r-xl); padding: var(--sp-5); position: relative; overflow: hidden; border: 1px solid var(--br2); }
  .hero.on { background: radial-gradient(120% 90% at 100% 0%, rgba(52,211,153,.22), transparent 55%), var(--s1); }
  .hero.later { background: radial-gradient(120% 90% at 100% 0%, rgba(255,107,91,.25), transparent 55%), var(--s1); }
  .hero.off { background: radial-gradient(120% 90% at 100% 0%, rgba(147,197,253,.16), transparent 55%), var(--s1); }
  .hero .status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 600; }
  .hero .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(52,211,153,.2); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(52,211,153,.05); } }
  .hero .big { font-size: 40px; font-weight: 700; letter-spacing: -.035em; margin: 10px 0 2px; line-height: 1; }
  .hero .meta { color: var(--muted); font-size: var(--fs-md); }
  .hero .meta b { color: var(--text); font-weight: 600; }
  .hero .actions { display: flex; gap: 8px; margin-top: var(--sp-4); }
  .hero .actions .btn { flex: 1; }
  .progress { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-top: var(--sp-3); }
  .tile { background: var(--s1); border: 1px solid var(--br); border-radius: var(--r-lg); padding: 14px 16px; cursor: pointer; }
  .tile .k { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
  .tile .v small { font-size: var(--fs-md); color: var(--muted); font-weight: 500; }
  .tile .s { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { text-align: center; padding: 10px 0 8px; border-radius: 12px; background: var(--s1); border: 1px solid var(--br); }
  .day .dn { font-size: 11px; color: var(--muted); font-weight: 600; }
  .day .dd { font-size: var(--fs-lg); font-weight: 650; margin-top: 2px; }
  .day .mk { height: 6px; margin-top: 6px; display: flex; justify-content: center; }
  .day .mk i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .day .mk i.to { background: var(--info); }
  .day.today { border-color: var(--accent); background: var(--accent-soft); }

  /* Schedule */
  .segctl { display: grid; grid-template-columns: 1fr 1fr; background: var(--s1); border: 1px solid var(--br); border-radius: 12px; padding: 3px; margin-bottom: var(--sp-3); }
  .segctl button { border: 0; background: transparent; min-height: 38px; border-radius: 9px; font-weight: 600; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; }
  .segctl button.on { background: var(--s3); color: var(--text); }
  .weeknav { display: flex; align-items: center; justify-content: space-between; margin: 0 0 var(--sp-3); }
  .weeknav .btn { width: var(--tap); padding: 0; }
  .weeknav .lbl { font-weight: 600; font-size: var(--fs-md); }
  .shift { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--br); align-items: center; }
  .shift:first-child { border-top: 0; }
  .shift .date { text-align: center; }
  .shift .date .d1 { font-size: 11px; color: var(--muted); font-weight: 650; text-transform: uppercase; }
  .shift .date .d2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .shift .t { font-size: var(--fs-lg); font-weight: 650; }
  .shift .loc { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: var(--fs-sm); color: var(--muted); flex-wrap: wrap; }
  .shift.off .t { color: var(--dim); font-weight: 500; font-size: var(--fs-md); }
  .shift.today { background: var(--accent-soft); }
  .faces { display: inline-flex; }
  .faces span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--s1); margin-left: -6px; font-size: 10px; font-weight: 700; display: grid; place-items: center; color: #fff; }
  .faces span:first-child { margin-left: 0; }
  .loctag { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 6px; }
  .loctag.store { background: rgba(255,107,91,.16); color: #ffa498; }
  .loctag.pack { background: rgba(167,139,250,.16); color: #c4b5fd; }
  .loctag.stream { background: rgba(52,211,153,.14); color: #6ee7b7; }
  .teamday h4 { margin: 18px 4px 8px; font-size: var(--fs-sm); color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
  .teamday h4.today { color: var(--accent); }
  .person { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--br); }
  .person:first-child { border-top: 0; }
  .person .nm { flex: 1; font-size: var(--fs-md); }
  .person .nm.me { font-weight: 700; }
  .person .hr { font-size: var(--fs-sm); color: var(--muted); }
  .mini { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }

  /* Hours */
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; margin-top: 16px; }
  .bar { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bar .sched { position: absolute; bottom: 18px; width: 100%; border: 1.5px dashed var(--br2); border-radius: 6px; }
  .bar .act { width: 100%; background: var(--accent); border-radius: 6px; position: relative; z-index: 1; margin-bottom: 18px; }
  .bar .act.zero { background: transparent; }
  .bar .lb { position: absolute; bottom: 0; font-size: 11px; color: var(--muted); font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: var(--fs-xs); color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .entry { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--br); align-items: center; }
  .entry:first-child { border-top: 0; }
  .entry .d { font-weight: 600; font-size: var(--fs-md); }
  .entry .x { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
  .entry .h { font-weight: 700; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
  .flag { color: var(--warn); font-size: var(--fs-xs); font-weight: 600; margin-top: 3px; }

  /* Requests */
  .newreq { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .newreq button { border: 1px solid var(--br); background: var(--s1); border-radius: var(--r-lg); padding: 16px; text-align: left; cursor: pointer; min-height: 104px; }
  .newreq button .ico { margin-bottom: 12px; }
  .newreq button .l1 { font-weight: 650; font-size: var(--fs-md); }
  .newreq button .l2 { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
  .req { padding: 14px 16px; border-top: 1px solid var(--br); }
  .req:first-child { border-top: 0; }
  .req .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .req .l1 { font-weight: 600; font-size: var(--fs-md); }
  .req .l2 { font-size: var(--fs-sm); color: var(--muted); margin-top: 3px; }
  .req .note { margin-top: 8px; font-size: var(--fs-sm); padding: 8px 10px; border-radius: 10px; background: var(--s2); color: #d4d4d8; }
  .req .acts { margin-top: 10px; display: flex; gap: 8px; }

  /* Sheet */
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--s1); border-radius: 26px 26px 0 0; border-top: 1px solid var(--br2);
    padding: 10px 18px 34px; transform: translateY(105%); transition: transform .35s cubic-bezier(.22,1,.36,1); }
  .phone.sheet-open .sheet-bg { opacity: 1; pointer-events: auto; }
  .phone.sheet-open .sheet { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--br2); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 4px; font-size: var(--fs-xl); letter-spacing: -.02em; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: 6px; }
  .input { min-height: var(--tap); width: 100%; border-radius: 12px; border: 1px solid var(--br2); background: var(--bg); padding: 10px 14px; font-size: var(--fs-md); color: var(--text); display: flex; align-items: center; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips span { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--br2); font-size: var(--fs-sm); font-weight: 550; }
  .chips span.on { border-color: var(--accent); background: var(--accent-soft); color: #ffb3aa; }
  .conflict { margin-top: 12px; font-size: var(--fs-sm); color: var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; }

  /* More */
  .me-card { display: flex; gap: 14px; align-items: center; }
  .me-card .avatar { width: 52px; height: 52px; font-size: 19px; }
  .me-card .nm { font-size: var(--fs-lg); font-weight: 700; }
  .ring { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--muted); }
  .ring .progress { flex: 1; margin: 0; }
  .ring .progress i { background: var(--accent); }
  .grp-h { margin: 22px 6px 8px; font-size: var(--fs-xs); color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .07em; }

  /* Bottom nav */
  .bnav { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(12,13,15,.86); backdrop-filter: blur(20px);
    border-top: 1px solid var(--br); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px 22px; z-index: 20; }
  .bnav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 11px; font-weight: 600; color: var(--dim); cursor: pointer; position: relative; min-height: var(--tap); }
  .bnav button svg { width: 24px; height: 24px; }
  .bnav button.on { color: var(--accent); }
  .bnav .badge { position: absolute; top: 2px; left: 50%; margin-left: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
</style>
</head>
<body>
<div class="stage">
  <h1>Employee portal redesign: mockup</h1>
  <p class="lede">These are the five employee screens, designed for a phone first and using the portal's existing colours. Click the bottom tabs to move between screens. The notes on the right compare each screen with today's page. All data here is made up.</p>

  <div class="controls">
    <div><label>Home state</label>
      <span class="seg" id="ctl-state">
        <button data-v="on" class="on">On the clock</button>
        <button data-v="later">Shift later today</button>
        <button data-v="off">Off today</button>
      </span></div>
    <div><label>Role</label>
      <span class="seg" id="ctl-role">
        <button data-v="hourly" class="on">Hourly</button>
        <button data-v="ops">Staff + ops tools</button>
      </span></div>
    <div><label>View</label>
      <span class="seg" id="ctl-view">
        <button data-v="one" class="on">Interactive</button>
        <button data-v="all">All screens</button>
      </span></div>
  </div>

  <div class="layout">
    <div id="main-phone"></div>
    <aside class="notes" id="notes"></aside>
  </div>
  <div class="all" id="all"></div>
</div>

<script>
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg>',

    '<b>Merges the Time off and Supply pages.</b> Both work the same way: submit, then wait for approve or decline.',

function render() {
  document.body.classList.toggle('show-all', S.view === 'all');
  if (S.view === 'all') {
    document.getElementById('all').innerHTML = Object.keys(SCREENS).map(k => `<div><div class="cap">${NOTES[k].h}</div>${phone(k,false)}</div>`).join('');
  } else {
    document.getElementById('main-phone').innerHTML = phone(S.tab, true);
    const n = NOTES[S.tab];
    document.getElementById('notes').innerHTML = `<h2>${n.h}</h2><p class="sub">${n.sub}</p><ol>${n.items.map(i=>`<li>${i}</li>`).join('')}</ol><div class="was">${n.was}</div>`;
  }
}

document.addEventListener('click', e => {
  const seg = e.target.closest('.seg button');
  if (seg) {
    const key = seg.parentElement.id.replace('ctl-','');
    S[key] = seg.dataset.v;
    seg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === seg));
    render(); return;
  }
  const ph = e.target.closest('.phone');
  if (!ph) return;
  if (e.target.closest('[data-close]')) { ph.classList.remove('sheet-open'); return; }
  const sc = e.target.closest('[data-sched]');
  if (sc) { S.sched = sc.dataset.sched; render(); return; }
  const sh = e.target.closest('[data-sheet]');
  const go = e.target.closest('[data-go]');
  if (go) {
    S.tab = go.dataset.go; S.view = 'one';
    document.querySelectorAll('#ctl-view button').forEach(b => b.classList.toggle('on', b.dataset.v === 'one'));
    render();
    if (sh) document.querySelector('#main-phone .phone').classList.add('sheet-open');
    return;
  }
  if (sh) ph.classList.add('sheet-open');
});

render();
</script>
</body>
</html>
